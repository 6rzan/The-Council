name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-scan gate (Constitution IV)
        run: |
          chmod +x scripts/secret-scan.sh
          bash scripts/secret-scan.sh
      - name: Confirm .env and .claude/ are gitignored
        run: |
          grep -qE '^\.env$' .gitignore
          grep -qE '^\.claude/$' .gitignore
          echo "gitignore check OK"
